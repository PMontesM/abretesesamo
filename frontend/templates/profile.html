<section x-show="page === 'profile'" x-cloak data-panel-page="profile" class="max-w-xl mx-auto w-full" x-data="profilePanel" x-init="loadProfile()">
<div class="bg-white shadow-soft p-5 md:p-6 mb-4"><h2 class="text-xl font-bold text-material-dark">Mi perfil</h2><p class="text-sm mt-2 text-material-text">Tu cuenta es la misma para todos tus edificios.</p><p class="text-xs mt-5 text-material-text">Teléfono</p><p class="font-medium break-all mt-1" x-text="phone"></p></div>
<div class="bg-white shadow-soft p-5 md:p-6"><h3 class="font-bold text-material-dark">Cambiar contraseña</h3><p class="text-sm mt-2 mb-4">Por seguridad, al guardarla tendrás que iniciar sesión de nuevo.</p><p role="alert" class="text-sm text-red-700 mb-3" x-text="profileError"></p>
<form @submit.prevent="saveProfilePassword()" x-show="!passwordSaved" class="space-y-4"><label class="block text-sm">Contraseña actual<input type="password" x-model="currentSecret" autocomplete="current-password" required maxlength="128" class="field"></label><label class="block text-sm">Nueva contraseña<input type="password" x-model="secret" autocomplete="new-password" required minlength="8" maxlength="128" class="field"></label><label class="block text-sm">Repetir nueva contraseña<input type="password" x-model="confirmSecret" autocomplete="new-password" required minlength="8" maxlength="128" class="field"></label><button type="submit" :disabled="profileBusy" class="w-full bg-material-dark text-white px-4 py-3 font-medium disabled:opacity-50">Guardar contraseña</button></form>
<div x-show="passwordSaved" role="status" class="bg-green-50 p-4 text-sm"><p>Contraseña actualizada. Inicia sesión con tu nueva contraseña.</p><a href="/login" class="inline-block mt-3 bg-material-dark text-white px-4 py-3">Volver a iniciar sesión</a></div></div></section>
