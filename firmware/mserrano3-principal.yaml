substitutions:
  device_name: mserrano3-principal
  friendly_name: "Portón Edificio"
  # Valor de banco de pruebas. Ajustar a la especificación de la entrada del equipo.
  relay_pulse_ms: "500"
  relay_cooldown_ms: "6000"
  relay_inverted: "false"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 700
    then:
      - lambda: |-
          char token[33];
          snprintf(token, sizeof(token), "%08x%08x%08x%08x",
                   (unsigned) random_uint32(), (unsigned) random_uint32(),
                   (unsigned) random_uint32(), (unsigned) random_uint32());
          id(boot_id) = token;
  on_shutdown:
    then:
      - output.turn_off: relay_output
      - logger.log: "Apagado controlado del firmware; salida del rele desactivada"

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG

debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      id: last_reset_reason
      internal: true
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  id: relay_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-setup"
    password: !secret ap_password
captive_portal:

globals:
  - id: boot_id
    type: std::string
    initial_value: '""'
    restore_value: false
  - id: recent_ids
    type: 'std::vector<std::string>'
    initial_value: 'std::vector<std::string>{}'
    restore_value: false
  - id: recent_results
    type: 'std::vector<std::string>'
    initial_value: 'std::vector<std::string>{}'
    restore_value: false
  - id: relay_busy
    type: bool
    initial_value: 'false'
  - id: pulse_active
    type: bool
    initial_value: 'false'

output:
  # LED de usuario del XIAO ESP32-C6: activo en bajo, independiente del rele.
  - platform: gpio
    id: connection_led
    pin:
      number: GPIO15
      inverted: true
  - platform: gpio
    id: relay_output
    pin:
      number: GPIO1
      inverted: ${relay_inverted}

sensor:
  - platform: wifi_signal
    id: wifi_signal_sensor
    internal: true
    update_interval: 60s

time:
  - platform: sntp
    id: clock_utc
    timezone: UTC
    servers:
      - time.cloudflare.com
      - pool.ntp.org
    on_time_sync:
      then:
        - script.execute: publish_status

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: 8883
  username: !secret mqtt_username
  password: !secret mqtt_password
  client_id: ${device_name}
  certificate_authority: !secret mqtt_ca_cert
  clean_session: true
  discovery: false
  discover_ip: false
  log_topic:
    topic: gate/${device_name}/log
    level: DEBUG   # Volver a INFO al terminar el diagnostico
    retain: false
  topic_prefix: null
  # ESPHome reinicia tras 15 minutos sin MQTT (valor previo por defecto).
  reboot_timeout: 15min
  keepalive: 15s
  # Evita bloquear el bucle de control al publicar por una conexión lenta.
  idf_send_async: true
  birth_message:
    topic: gate/${device_name}/state
    payload: initializing
    retain: true
  will_message:
    topic: gate/${device_name}/state
    payload: offline
    retain: true
  shutdown_message:
    topic: gate/${device_name}/state
    payload: offline
    retain: true
  on_connect:
    then:
      - script.execute: publish_status
  on_json_message:
    - topic: gate/${device_name}/cmd
      qos: 1
      then:
        - lambda: |-
            // Sin JSON válido no hay pulso. OPEN como texto deja de aceptarse.
            if (!x["id"].is<const char *>()) return;
            const std::string command_id = x["id"].as<std::string>();
            if (command_id.size() != 36) return;
            for (size_t i = 0; i < command_id.size(); ++i) {
              const char c = command_id[i];
              const bool hyphen = i == 8 || i == 13 || i == 18 || i == 23;
              if (hyphen ? c != '-' : !((c >= '0' && c <= '9') || (c >= 'a' && c <= 'f'))) return;
            }
            auto ack = [&](const char *status, const char *reason) {
              id(mqtt_client).publish_json("gate/${device_name}/ack", [&](JsonObject root) {
                root["id"] = command_id;
                root["boot_id"] = id(boot_id);
                root["status"] = status;
                root["reason"] = reason;
                root["protocol"] = 2;
              }, 1, false);
            };
            if (!x["action"].is<const char *>() || x["action"].as<std::string>() != "OPEN") {
              ack("rejected", "invalid_action"); return;
            }
            if (!x["boot_id"].is<const char *>() || x["boot_id"].as<std::string>() != id(boot_id)) {
              ack("rejected", "boot_changed"); return;
            }
            // Responde por la orden conocida, sin accionar otra vez aunque haya caducado.
            for (size_t i = 0; i < id(recent_ids).size(); ++i) {
              if (id(recent_ids)[i] == command_id) {
                ack("duplicate", id(recent_results)[i].c_str()); return;
              }
            }
            const auto now = id(clock_utc).now();
            if (!now.is_valid()) { ack("rejected", "clock_not_ready"); return; }
            if (!x["issued_at"].is<int64_t>() || !x["expires_at"].is<int64_t>()) {
              ack("rejected", "invalid_time"); return;
            }
            const int64_t issued = x["issued_at"].as<int64_t>();
            const int64_t expires = x["expires_at"].as<int64_t>();
            const int64_t current = now.timestamp;
            if (issued <= 0 || expires <= issued || expires - issued > 15 || issued > current + 2 || expires <= current) {
              ack("rejected", "expired_or_invalid_time"); return;
            }
            if (id(relay_busy)) { ack("rejected", "busy"); return; }
            // Reserva antes de cualquier publicación o pulso. Memoria acotada.
            if (id(recent_ids).size() >= 32) {
              id(recent_ids).erase(id(recent_ids).begin());
              id(recent_results).erase(id(recent_results).begin());
            }
            id(recent_ids).push_back(command_id);
            id(recent_results).push_back("accepted");
            id(relay_busy) = true;
            ack("accepted", "");
            id(pulse_relay).execute(command_id);

interval:
  # Sin esperas bloqueantes ni publicaciones MQTT; no depende del pulso/cooldown.
  - interval: 100ms
    then:
      - lambda: |-
          static bool was_ready = false;
          static uint16_t startup_ticks = 0;
          static uint8_t previous_mode = 255;
          static uint8_t tick = 0;
          if (startup_ticks < 600) ++startup_ticks;
          const bool connected = id(relay_wifi).is_connected() && id(mqtt_client).is_connected();
          const bool ready = connected && id(clock_utc).now().is_valid();
          if (ready) was_ready = true;
          // 0: arranque (max. 60s); 1: conexion y hora listas; 2: fallo local.
          const uint8_t mode = ready ? 1 : ((!was_ready && startup_ticks < 600) ? 0 : 2);
          if (mode != previous_mode) { tick = 0; previous_mode = mode; }
          const uint8_t period = mode == 1 ? 1 : (mode == 0 ? 10 : 4);
          const uint8_t on_ticks = mode == 1 ? 1 : (mode == 0 ? 5 : 2);
          if (tick < on_ticks) id(connection_led).turn_on();
          else id(connection_led).turn_off();
          tick = (tick + 1) % period;
  - interval: 5min
    then:
      - script.execute: publish_status

script:
  - id: publish_status
    mode: restart
    then:
      - if:
          condition:
            mqtt.connected:
          then:
            - mqtt.publish:
                topic: gate/${device_name}/state
                retain: true
                payload: !lambda |-
                  if (id(pulse_active)) return std::string("opening");
                  if (id(relay_busy)) return std::string("cooldown");
                  return std::string(id(clock_utc).now().is_valid() ? "online" : "initializing");
            - mqtt.publish_json:
                topic: gate/${device_name}/info
                retain: true
                payload: |-
                  root["protocol"] = 2;
                  root["boot_id"] = id(boot_id);
                  root["pulse_ms"] = ${relay_pulse_ms};
                  root["cooldown_ms"] = ${relay_cooldown_ms};
                  root["clock_ready"] = id(clock_utc).now().is_valid();
            - mqtt.publish_json:
                topic: gate/${device_name}/health
                retain: true
                payload: |-
                  if (std::isfinite(id(wifi_signal_sensor).state)) root["rssi"] = (int) id(wifi_signal_sensor).state;
                  root["uptime_s"] = (uint32_t) (millis() / 1000);
                  root["boot_id"] = id(boot_id);
                  root["reset_reason"] = id(last_reset_reason).state;
                  root["firmware_revision"] = "2026-09-18-diagnostics-1";
                  root["sampled_at"] = id(clock_utc).now().is_valid() ? id(clock_utc).now().timestamp : 0;

  - id: pulse_relay
    mode: single
    parameters:
      command_id: string
    then:
      - lambda: |-
          static_assert(${relay_pulse_ms} >= 100 && ${relay_pulse_ms} <= 2000, "Pulse must be 100..2000 ms");
          static_assert(${relay_cooldown_ms} >= 6000, "Cooldown must be at least 6000 ms");
          id(pulse_active) = true;
      - mqtt.publish:
          topic: gate/${device_name}/state
          payload: opening
          retain: true
      - output.turn_on: relay_output
      - delay: ${relay_pulse_ms}ms
      - output.turn_off: relay_output
      - lambda: |-
          id(pulse_active) = false;
          for (size_t i = 0; i < id(recent_ids).size(); ++i)
            if (id(recent_ids)[i] == command_id) id(recent_results)[i] = "completed";
      # completed confirma que el firmware terminó el pulso, no movimiento físico.
      - mqtt.publish_json:
          topic: gate/${device_name}/ack
          qos: 1
          retain: false
          payload: |-
            root["id"] = command_id;
            root["boot_id"] = id(boot_id);
            root["protocol"] = 2;
            root["status"] = "completed";
            root["pulse_ms"] = ${relay_pulse_ms};
      - script.execute: publish_status
      - delay: ${relay_cooldown_ms}ms
      - lambda: 'id(relay_busy) = false;'
      - script.execute: publish_status
